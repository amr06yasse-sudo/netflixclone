<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | Netflix Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a class="nf-logo" href="index.html">NETFLIX</a>
  </header>

  <main class="auth-wrap">
    <div class="auth-card">
      <h1>Sign In</h1>
      <div id="formAlert" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-floating mb-3">
          <input type="email" class="form-control nf-input" id="email" placeholder="Email" required>
          <label for="email">Email</label>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="form-floating mb-3">
          <input type="password" class="form-control nf-input" id="password" placeholder="Password" minlength="6" required>
          <label for="password">Password</label>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <button type="submit" class="btn nf-btn w-100 mt-2">Sign In</button>

        <div class="d-flex justify-content-between align-items-center mt-3 small text-secondary">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a href="#" class="auth-link-muted">Need help?</a>
        </div>
      </form>

      <p class="mt-5 text-secondary">New to Netflix? <a href="register.html" class="auth-link">Sign up now</a>.</p>
      <p class="small text-secondary mb-0">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
    </div>
  </main>

  <footer class="auth-footer">
    <div class="container">
      <p>Questions? Call 0-800-000-000</p>
      <div class="row small">
        <div class="col-6 col-md-3"><a href="#">FAQ</a></div>
        <div class="col-6 col-md-3"><a href="#">Help Center</a></div>
        <div class="col-6 col-md-3"><a href="#">Terms of Use</a></div>
        <div class="col-6 col-md-3"><a href="#">Privacy</a></div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
